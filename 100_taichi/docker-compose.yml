version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: taichi_training
      MYSQL_USER: taichi_user
      MYSQL_PASSWORD: taichi_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - taichi-network

  # MinIO对象存储
  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # API端口
      - "9001:9001"  # 控制台端口
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - taichi-network

  # 后端API服务
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+mysqlconnector://taichi_user:taichi_password@mysql:3306/taichi_training
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=taichi-media
    depends_on:
      - mysql
      - minio
    volumes:
      - ./backend:/app
    networks:
      - taichi-network

  # Nginx反向代理（可选）
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
    networks:
      - taichi-network

volumes:
  mysql_data:
  minio_data:

networks:
  taichi-network:
    driver: bridge